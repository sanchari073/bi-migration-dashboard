<svg width="100%" viewBox="0 0 680 480" role="img" xmlns="http://www.w3.org/2000/svg">
<title>Superstore star schema data model</title>
<desc>Star schema with fact_orders at center connected to dim_date, dim_customer, and dim_product</desc>
<defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
    <path d="M2 1L8 5L2 9" fill="none" stroke="#888" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
  </marker>
</defs>

<!-- fact_orders (center) -->
<rect x="230" y="160" width="220" height="200" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<rect x="230" y="160" width="220" height="32" rx="8" fill="#534AB7"/>
<rect x="230" y="184" width="220" height="8" fill="#534AB7"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="white" x="340" y="181" text-anchor="middle" dominant-baseline="central">fact_orders</text>
<text font-family="sans-serif" font-size="12" fill="#3C3489" x="248" y="210" dominant-baseline="central">order_line_key (PK)</text>
<text font-family="sans-serif" font-size="12" fill="#3C3489" x="248" y="228" dominant-baseline="central">order_id</text>
<text font-family="sans-serif" font-size="12" fill="#534AB7" x="248" y="246" dominant-baseline="central" font-style="italic">order_date_key (FK)</text>
<text font-family="sans-serif" font-size="12" fill="#534AB7" x="248" y="264" dominant-baseline="central" font-style="italic">ship_date_key (FK)</text>
<text font-family="sans-serif" font-size="12" fill="#534AB7" x="248" y="282" dominant-baseline="central" font-style="italic">customer_key (FK)</text>
<text font-family="sans-serif" font-size="12" fill="#534AB7" x="248" y="300" dominant-baseline="central" font-style="italic">product_key (FK)</text>
<text font-family="sans-serif" font-size="12" fill="#3C3489" x="248" y="318" dominant-baseline="central">sales, profit, discount</text>
<text font-family="sans-serif" font-size="12" fill="#3C3489" x="248" y="336" dominant-baseline="central">profit_margin, days_to_ship</text>

<!-- dim_date (top) -->
<rect x="230" y="20" width="220" height="108" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<rect x="230" y="20" width="220" height="32" rx="8" fill="#0F6E56"/>
<rect x="230" y="44" width="220" height="8" fill="#0F6E56"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="white" x="340" y="37" text-anchor="middle" dominant-baseline="central">dim_date</text>
<text font-family="sans-serif" font-size="12" fill="#085041" x="248" y="66" dominant-baseline="central">date_key (PK)</text>
<text font-family="sans-serif" font-size="12" fill="#085041" x="248" y="84" dominant-baseline="central">full_date, year, quarter</text>
<text font-family="sans-serif" font-size="12" fill="#085041" x="248" y="102" dominant-baseline="central">month, week_of_year</text>
<text font-family="sans-serif" font-size="12" fill="#085041" x="248" y="120" dominant-baseline="central">day_of_week, is_weekend</text>

<!-- dim_customer (left) -->
<rect x="20" y="200" width="180" height="120" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<rect x="20" y="200" width="180" height="32" rx="8" fill="#993C1D"/>
<rect x="20" y="224" width="180" height="8" fill="#993C1D"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="white" x="110" y="217" text-anchor="middle" dominant-baseline="central">dim_customer</text>
<text font-family="sans-serif" font-size="12" fill="#712B13" x="36" y="252" dominant-baseline="central">customer_key (PK)</text>
<text font-family="sans-serif" font-size="12" fill="#712B13" x="36" y="270" dominant-baseline="central">customer_id, name</text>
<text font-family="sans-serif" font-size="12" fill="#712B13" x="36" y="288" dominant-baseline="central">segment, region</text>
<text font-family="sans-serif" font-size="12" fill="#712B13" x="36" y="306" dominant-baseline="central">state, city</text>

<!-- dim_product (right) -->
<rect x="460" y="200" width="200" height="120" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<rect x="460" y="200" width="200" height="32" rx="8" fill="#854F0B"/>
<rect x="460" y="224" width="200" height="8" fill="#854F0B"/>
<text font-family="sans-serif" font-size="14" font-weight="500" fill="white" x="560" y="217" text-anchor="middle" dominant-baseline="central">dim_product</text>
<text font-family="sans-serif" font-size="12" fill="#633806" x="476" y="252" dominant-baseline="central">product_key (PK)</text>
<text font-family="sans-serif" font-size="12" fill="#633806" x="476" y="270" dominant-baseline="central">product_id, name</text>
<text font-family="sans-serif" font-size="12" fill="#633806" x="476" y="288" dominant-baseline="central">category</text>
<text font-family="sans-serif" font-size="12" fill="#633806" x="476" y="306" dominant-baseline="central">sub_category</text>

<!-- staging (bottom) -->
<rect x="230" y="390" width="220" height="60" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text font-family="sans-serif" font-size="13" font-weight="500" fill="#2C2C2A" x="340" y="412" text-anchor="middle" dominant-baseline="central">staging.superstore_raw</text>
<text font-family="sans-serif" font-size="11" fill="#5F5E5A" x="340" y="432" text-anchor="middle" dominant-baseline="central">flat CSV → loaded here first</text>

<!-- fact → dim_date -->
<line x1="340" y1="160" x2="340" y2="130" stroke="#888" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text font-family="sans-serif" font-size="11" fill="#888" x="348" y="148" dominant-baseline="central">Many:1</text>

<!-- fact → dim_customer -->
<line x1="230" y1="262" x2="200" y2="262" stroke="#888" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text font-family="sans-serif" font-size="11" fill="#888" x="204" y="252" dominant-baseline="central">Many:1</text>

<!-- fact → dim_product -->
<line x1="450" y1="262" x2="460" y2="262" stroke="#888" stroke-width="1" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<text font-family="sans-serif" font-size="11" fill="#888" x="452" y="252" dominant-baseline="central">Many:1</text>

<!-- staging → fact -->
<line x1="340" y1="390" x2="340" y2="362" stroke="#888" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
<text font-family="sans-serif" font-size="11" fill="#888" x="348" y="378" dominant-baseline="central">ETL</text>

</svg>
